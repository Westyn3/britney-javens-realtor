name: SEO Content Cleanup

on:
  push:
    branches: [seo-content-cleanup]
    paths:
      - '.github/workflows/seo-content-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-cleanup
      - name: Clean up real estate claims
        shell: python
        run: |
          from pathlib import Path

          replacements = {
            'norcross.html': [
              ("and steady appreciation as nearby markets price buyers outward.", "and a range of housing options for buyers who want historic character and convenient access to nearby job centers."),
              ("The West Norcross and downtown-adjacent streets in particular have become quiet appreciation stories.", "West Norcross and downtown-adjacent streets are especially worth comparing for buyers who want established homes, renovation activity, and proximity to the historic core."),
              ("Bring your own representation — it costs you nothing, and it means someone is negotiating your incentives, reviewing the contract's fine print, and insisting on independent inspections before drywall and at closing.", "Bring your own representation so you have someone negotiating incentives, reviewing the contract's fine print, and advocating for independent inspections before drywall and at closing. Buyer-agent compensation should be discussed up front and may be negotiated as part of the transaction."),
              ("One of the best in the inner metro — attainable prices, a real downtown, easy I-85 and Peachtree Industrial access, and appreciation fed by buyers priced out of the neighbors. It's the classic get-in-early market.", "It can be a strong option for first-time buyers who value attainable price points, a real downtown, and easy I-85 and Peachtree Industrial access. Compare current inventory, monthly costs, and neighborhood fit before deciding where to buy."),
            ],
            'chamblee.html': [
              ("have made it one of metro Atlanta's most consistently appreciating markets.", "continue to attract buyers looking for an intown location with transit, dining, and a growing mix of housing."),
              ("For first-time buyers, young families, and investors, the math is compelling: MARTA access, a walkable downtown that improves by the quarter, Brookhaven and Buckhead minutes away, and appreciation that has consistently outrun the metro average. The window where Chamblee is a value play won't stay open forever — that's precisely its appeal.", "For first-time buyers, young families, and investors, Chamblee offers a compelling mix: MARTA access, a walkable downtown, Brookhaven and Buckhead minutes away, and a broad range of condos, townhomes, ranches, and new construction. The right value depends on the property, condition, location, and current market — so I help buyers compare the numbers before they commit."),
              ("Chamblee is the buy-now-thank-yourself-later market — the downtown gets better every quarter, and the ranches won't stay this price forever.", "Chamblee gives buyers a rare combination of MARTA access, a walkable downtown, classic neighborhoods, and quick access to Brookhaven and Buckhead."),
              ("Genuinely — the downtown adds restaurants and development every year, MARTA is in place, and appreciation has consistently outrun the metro average. The 'discovery' phase is well underway, which is exactly why timing matters.", "Chamblee has seen substantial downtown redevelopment, new housing, and restaurant growth, while its MARTA station and proximity to Brookhaven and Buckhead remain major draws. Current pricing and inventory vary, so reach out for a fresh market read."),
              ("For first homes and young families, it's one of the smartest buys in the metro.", "For first-time buyers and young families, it's a market worth comparing closely with nearby Brookhaven, Doraville, and Sandy Springs."),
            ],
            'cumming.html': [
              ("Georgia's fastest-growing county for a reason: nationally ranked Forsyth schools, deep new-construction inventory, the new Cumming City Center, and weekend life on Lake Lanier's southwest shore.", "Cumming and Forsyth County continue to attract buyers with well-regarded schools, deep new-construction inventory, the Cumming City Center, and weekend life on Lake Lanier's southwest shore."),
              ("For more than a decade, Forsyth County has been one of the fastest-growing counties in America — and Cumming is the reason families keep arriving. The math is simple: Forsyth County Schools rank among the very best in Georgia, the housing dollar stretches further than it does down GA-400, and the quality of life keeps compounding as the county grows into itself.", "Forsyth County has experienced substantial population and housing growth over the past decade, and Cumming remains a major center of that growth. Buyers are often drawn by the school system, new-construction choices, GA-400 access, and the amount of home and land available compared with some markets farther south."),
              ("For buyers priced out further south — and sellers riding a decade of appreciation — Cumming is North Atlanta's most active market.", "For buyers comparing the GA-400 corridor, Cumming offers a broad mix of new construction, established neighborhoods, and Lake Lanier properties. Current pricing and competition vary by neighborhood and price point."),
              ("Nationally ranked schools, a new walkable downtown at the City Center, lake access, and the best housing value on the corridor — that combination is why Forsyth has spent a decade among America's fastest-growing counties.", "Well-regarded schools, the Cumming City Center, Lake Lanier access, and a broad range of housing options are major reasons buyers consider Forsyth County. Growth also means traffic and construction can be part of the trade-off."),
            ],
            'johns-creek.html': [
              ("Top-ranked schools, country clubs & one of America's safest cities.", "Well-regarded schools, country clubs & a strong community reputation."),
              ("top-ranked schools, country club communities, and one of America's safest cities", "well-regarded schools, country club communities, and a strong reputation for community amenities"),
              ("One of America's safest cities, some of Georgia's top-ranked schools, and country club communities like St. Ives and the Country Club of the South.", "Well-regarded schools, established country club communities like St. Ives and the Country Club of the South, and extensive parks and community amenities."),
              ("Incorporated in 2006, it has spent nearly two decades earning national rankings — regularly cited among the safest cities in America and among the best places to live in Georgia — on the strength of its schools, parks, and famously well-run local government.", "Incorporated in 2006, Johns Creek has built a strong reputation around its schools, parks, community services, and established residential neighborhoods."),
              ("Yes — Johns Creek regularly appears in national rankings of the safest cities in the United States for its size, one of the biggest drivers of its steady housing demand.", "Johns Creek has appeared in a variety of safety and quality-of-life rankings over the years. Rankings and methodologies change, so buyers should review current public-safety data and the factors that matter most to their household."),
              ("It regularly appears in national safest-city rankings for its size, alongside best-places-to-live lists for Georgia. That reputation is a big driver of its steady housing demand.", "Johns Creek has appeared in safety and quality-of-life rankings over the years, but rankings and methodologies change. Buyers should review current public-safety data alongside schools, commute, amenities, and neighborhood fit."),
            ],
            'alpharetta.html': [
              ("Alpharetta consistently ranks among the best places to live in Georgia and the U.S., combining strong schools, a major job center, walkable retail districts, and quick GA-400 access to Atlanta — which is why demand for Alpharetta homes stays deep at every price point.", "Alpharetta is widely known for strong schools, a major job center, walkable retail districts, and quick GA-400 access to Atlanta. Those fundamentals continue to make it a popular North Atlanta market across a wide range of price points."),
              ("it's easy to see why Alpharetta shows up on every \"best places to live\" list year after year.", "it's easy to see why Alpharetta remains a popular choice for buyers across North Atlanta."),
            ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {filename}: {old[:80]}')
                  text = text.replace(old, new)
              path.write_text(text)

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add norcross.html chamblee.html cumming.html johns-creek.html alpharetta.html
          git diff --cached --check
          git commit -m "Clean up stale and misleading real estate claims"
          git push origin seo-content-cleanup
