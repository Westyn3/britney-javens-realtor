name: Market Content Cleanup

on:
  push:
    branches: [market-content-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-content-cleanup
      - name: Clean up market page claims
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('market.html')
          s = p.read_text()
          replacements = {
            "Georgia's fastest growing county — top schools, new construction and south Lake Lanier access.": "Forsyth County growth, schools, new construction and south Lake Lanier access.",
            "From gated luxury in Alpharetta and Milton to Buckhead high-rises, Roswell's historic canton, and Forsyth County's fast-growing family neighborhoods — Britney Javens knows every market, every street, and every school district along the GA-400 corridor.": "From gated luxury in Alpharetta and Milton to Buckhead high-rises, Roswell's historic charm, and Forsyth County's growing communities — Britney Javens helps buyers compare neighborhoods, housing options, amenities, and school zones across the GA-400 corridor.",
            "Alpharetta and Milton represent the pinnacle of North Atlanta luxury living. Known for their award-winning Fulton County schools, master-planned communities, and proximity to the vibrant Alpharetta City Center, these cities consistently rank among Georgia's most desirable places to live.": "Alpharetta and Milton are two of North Atlanta's best-known luxury markets, with Fulton County schools, master-planned communities, gated neighborhoods, and convenient access to Alpharetta City Center and Avalon. Buyers should verify current school assignments and compare neighborhoods based on the features that matter most to them.",
            "Forsyth County has been one of the fastest-growing counties in the entire United States for over a decade — and once you visit, it's easy to see why. Cumming offers an incredible combination of value, space, top schools, and a small-town feel with big-city access.": "Forsyth County has experienced substantial growth over the past decade, and Cumming continues to attract buyers looking for space, newer housing, schools, Lake Lanier access, and convenient access to the GA-400 corridor.",
            "From master-planned swim-tennis communities with resort-style amenities to lakefront properties on Lake Lanier's southern shores, Forsyth County delivers exceptional quality of life at a price point that still makes sense. Families flock here for the nationally ranked schools, low crime rates, and strong sense of community.": "From master-planned swim-tennis communities with resort-style amenities to lakefront properties on Lake Lanier's southern shores, Forsyth County offers a wide range of housing and lifestyle options. School performance, zoning, housing costs, and neighborhood conditions change over time, so buyers should review current information for any home they are considering.",
            "Strong investment value — waterfront properties hold & appreciate": "Distinctive waterfront inventory with private-dock and lake-access options",
            "rapid revitalization northeast of Atlanta.": "walkable downtowns, established neighborhoods and redevelopment northeast of Atlanta."
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new)
          # Remove volatile stat cards where exact figures age quickly.
          s = s.replace('<strong>#1</strong>\n                <span>Fastest Growing County in GA</span>', '<strong>GA-400</strong>\n                <span>North Atlanta Access</span>')
          s = s.replace('<strong>$550K+</strong>\n                <span>Median Home Price</span>', '<strong>Lake Lanier</strong>\n                <span>South Shore Access</span>')
          s = s.replace('<strong>A+</strong>\n                <span>School Rating</span>', '<strong>New Builds</strong>\n                <span>Growing Inventory</span>')
          s = s.replace('<strong>$700K+</strong>\n                <span>Median Home Price</span>', '<strong>Luxury</strong>\n                <span>Homes & Estates</span>')
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.html
          git diff --cached --check
          git commit -m "Make market page claims evergreen and accurate"
          git push origin HEAD:market-content-cleanup
