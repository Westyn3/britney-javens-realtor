  <style>
    :root {
      --cream: #f9f5ef;
      --warm-white: #fdfaf6;
      --charcoal: #1c1c1c;
      --gold: #b8963e;
      --gold-text: #8a6e2a;

      --border: #e0d8cc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Jost', sans-serif;
      background: var(--warm-white);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrap { text-align: center; max-width: 560px; }
    .code {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(96px, 18vw, 160px);
      font-weight: 500;
      color: var(--gold);
      line-height: 1;
    }

      font-size: clamp(28px, 5vw, 38px);
      font-weight: 600;
      margin: 12px 0 16px;
    }
    p { color: var(--mid); font-weight: 300; line-height: 1.7; margin-bottom: 32px; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn {
      display: inline-block;
      padding: 13px 30px;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all .25s ease;
    }
    .btn-gold { background: var(--gold); color: #fff; }
    .btn-gold:hover { background: var(--gold-text); }
    .btn-line { border: 1px solid var(--border); color: var(--charcoal); }
    .btn-line:hover { border-color: var(--gold); color: var(--gold-text); }
    .sub { margin-top: 40px; font-size: 14px; color: var(--mid); }
    .sub a { color: var(--gold-text); text-decoration: none; }
